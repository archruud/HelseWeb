version: "3.9"

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: helsejournal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: helsejournal
      POSTGRES_USER: helsejournal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helsejournal_secure_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helsejournal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis (caching & session store)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: helsejournal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ============================================================
  # Backend API (FastAPI)
  # ============================================================
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: helsejournal-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://helsejournal:${DB_PASSWORD:-helsejournal_secure_2024}@postgres:5432/helsejournal
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-use-openssl-rand-hex-32}
      UPLOAD_DIR: /data/documents
      PRIVATE_DIR: /data/private
      FRONTEND_URL: http://localhost:3000
      OLLAMA_URL: http://ollama:11434
      CHROMA_DIR: /data/chromadb
    volumes:
      - documents_data:/data/documents
      - private_data:/data/private
      - chromadb_data:/data/chromadb
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ============================================================
  # Frontend (React/Vite)
  # ============================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: helsejournal-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ============================================================
  # Ollama (Local LLM with GPU)
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: helsejournal-ai
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: helsejournal-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  documents_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/nas/helsejournal/documents
  private_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/nas/helsejournal/private
  chromadb_data:
  ollama_data:
